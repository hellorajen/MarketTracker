name: Generate Macro Matrix PDF

on:
  schedule:
    - cron: '0 23 * * *'  # Runs every day at 23:00 UTC
  workflow_dispatch:  # Allows manual triggering from the GitHub UI

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PDF Generator Script
        run: |
          python generate_fin_chart.py

      - name: Upload Generated PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetGanesh_Global_Macro_Matrix_2026
          path: NetGanesh_Global_Macro_Matrix_2026.pdf
          retention-days: 30