name: Generate and Publish Macro Matrix PDF

on:
  schedule:
    # Runs every day at 23:00 UTC (after markets close)
    - cron: '0 23 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PDF Generator Script
        run: |
          python generate_fin_chart.py

      - name: Commit and Push Updated PDF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NetGanesh_Global_Macro_Matrix_2026.pdf
          git diff --staged --quiet || git commit -m "Auto-refresh macro matrix PDF [skip ci]"
          git push